<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Enquiries | Africa Ladies Fashion</title>
    <meta name="description" content="Ask Africa Ladies Fashion about women's clothing, fashion accessories, product sizes and availability in Cosmo City, Roodepoort.">

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <header>
        <h1>Africa Ladies Fashion</h1>

        <img src="images/logo.jpg"
             alt="Africa Ladies Fashion Logo"
             width="1000" height="1000">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="products.html">Products</a>
            <a href="gallery.html">Gallery</a>
            <a href="enquiry.html">Enquiries</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Product Enquiry</h2>

            <p>
                Interested in one of our fashion items?
                Complete the form below to ask about a product,
                its size or its availability.
            </p>
        </section>

        <section>
            <h2>Enquiry Form</h2>

            <form id="enquiry-form" class="site-form">

                <input type="hidden" name="form_type"
                       value="Product Enquiry">

                <p>
                    <label for="enquiry-name">Full Name:</label>
                    <input type="text" id="enquiry-name"
                           name="name" required minlength="2"
                           maxlength="60">
                </p>

                <p>
                    <label for="enquiry-email">Email Address:</label>
                    <input type="email" id="enquiry-email"
                           name="email" required>
                </p>

                <p>
                    <label for="enquiry-phone">Phone Number:</label>
                    <input type="tel" id="enquiry-phone"
                           name="phone"
                           pattern="[0-9+() -]{7,20}"
                           title="Enter a valid phone number."
                           required>
                </p>

                <p>
                    <label for="product-category">Product Category:</label>
                    <select id="product-category"
                            name="product_category" required>
                        <option value="">Select a category</option>
                        <option value="Dresses">Dresses</option>
                        <option value="Tops">Tops</option>
                        <option value="Jeans and Trousers">
                            Jeans and Trousers
                        </option>
                        <option value="Handbags">Handbags</option>
                        <option value="Shoes">Shoes</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Other">Other</option>
                    </select>
                </p>

                <p>
                    <label for="product-name">Product Name or Description:</label>
                    <input type="text" id="product-name"
                           name="product_name"
                           maxlength="100" required>
                </p>

                <p>
                    <label for="enquiry-message">Your Enquiry:</label>
                    <textarea id="enquiry-message"
                              name="message"
                              rows="6" minlength="10"
                              maxlength="1000" required></textarea>
                </p>

                <p>
                    <button type="submit">Submit Enquiry</button>
                </p>

                <p id="enquiry-status"
                   class="form-status"
                   role="status" aria-live="polite"></p>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; Africa Ladies Fashion</p>
    </footer>

    <script src="JavaScript/forms.js"></script>

</body>
</html>
