<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Gallery | Africa Ladies Fashion</title>
<meta name="description" content="View the Africa Ladies Fashion gallery featuring women's clothing, dresses, tops, jeans, handbags, shoes and accessories.">
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <header>

        <h1>Africa Ladies Fashion</h1>
        <img src="images/logo.jpg" alt="Africa Ladies Fashion Logo" width="1000" height="1000">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="products.html">Products</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact Us</a>
            <a href="enquiry.html">Enquiries</a>
        </nav>

    </header>


    <main>

        <section>

            <h2>Our Fashion Gallery</h2>

            <p>
                Explore some examples of the fashion products and
                accessories available at Africa Ladies Fashion.
            </p>

        </section>


        <section>

            <h2>Women's Clothing</h2>

            <figure>

                <img src="images/dress1.webp"
                     alt="Women's fashion dress" width="500" height="500" loading="lazy">
                <img src="images/dress2.jpg" 
                    alt="Women's fashion dress" width="400" height="500" loading="lazy">
                <img src="images/dress3.jpg" alt="Women's fashion dress" width="400" height="500" loading="lazy">

                <figcaption>
                    Women's Fashion Dress
                </figcaption>

            </figure>


            <figure>

                <img src="images/top1.webp"
                     alt="Women's fashion top" width="500" height="500"loading="lazy">
                <img src="images/top2.jpg" alt="Women's fashion top" width="400" height="500" loading="lazy">
                <img src="images/top3.jpg" alt="Women's fashion top" width="400" height="500" loading="lazy">

                <figcaption>
                    Women's Fashion Top
                </figcaption>

            </figure>


            <figure>

                <img src="images/jeans1.webp"
                     alt="Women's jeans" width="500" height="500" loading="lazy">
                <img src="images/jeans2.jpg" alt="Women's jeans" width="400" height="500" loading="lazy">
                <img src="images/jeans3.jpg" alt="Women's jeans" width="400" height="500" loading="lazy">

                <figcaption>
                    Women's Jeans
                </figcaption>

            </figure>

        </section>


        <section>

            <h2>Fashion Accessories</h2>

            <figure>

                <img src="images/handbag1.jpg"
                     alt="Women's handbag" width="500" height="500"loading="lazy">
                <img src="images/handbag2.jpg" alt="Women's handbag" width="400" height="500" loading="lazy">
                <img src="images/handbag3.jpg" alt="Women's handbag" width="400" height="500" loading="lazy">

                <figcaption>
                    Women's Handbag
                </figcaption>

            </figure>


            <figure>

                <img src="images/shoes1.jpg"
                     alt="Women's fashion shoes" width="500" height="500"loading="lazy">
                <img src="images/shoes2.jpg" alt="Women's fashion shoes" width="400" height="500" loading="lazy">
                <img src="images/shoes3.jpg" alt="Women's fashion shoes" width="400" height="500" loading="lazy">

                <figcaption>
                    Women's Fashion Shoes
                </figcaption>

            </figure>


            <figure>

                <img src="images/accessory1.jpg"
                     alt="Women's fashion accessories" width="500" height="500" loading="lazy">
                <img src="images/accessory2.jpg" alt="Women's fashion accessories" width="400" height="500" loading="lazy">
                <img src="images/accessory3.jpg" alt="Women's fashion accessories" width="400" height="500" loading="lazy">

                <figcaption>
                    Fashion Accessories
                </figcaption>

            </figure>

        </section>

    </main>
    <!-- Image Lightbox -->
    <div id="lightbox" class="lightbox" role="dialog"
         aria-modal="true" aria-label="Enlarged gallery image"
         aria-hidden="true">

        <button type="button" id="lightbox-close"
                class="lightbox-close" aria-label="Close image">
            &times;
        </button>

        <img id="lightbox-image" src="" alt="">

    </div>

    <footer>

        <p>
            &copy; Junior Dube
        </p>

    </footer>
<script src="JavaScript/script.js"></script>
</body>

</html>
